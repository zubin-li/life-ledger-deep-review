<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Life Ledger · Deep Review</title>
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <main class="launcher">
      <aside class="launcher-source">
        <div class="launcher-brand">
          <img src="./assets/app-icon.svg" alt="" width="22" height="22" />
          <span id="title">Life Ledger</span>
        </div>
        <p class="launcher-version">3.4.0</p>
        <p class="launcher-subtitle" id="subtitle"></p>
        <p class="launcher-footnote" id="privacyNote"></p>
      </aside>
      <section class="launcher-work">
      <header class="launcher-bar">
        <label class="launcher-language" for="languageSelect">
          <span class="sr-only" id="languageLabel">Language</span>
          <select id="languageSelect" aria-label="Launcher language">
            <option value="en">English</option>
            <option value="zh">简体中文</option>
            <option value="de">Deutsch</option>
          </select>
        </label>
      </header>

      <div class="launcher-choices">
        <section class="choice">
          <div class="hairline-mount choice-hairline" data-hairline-src="./assets/hairline/launcher-local.svg" aria-hidden="true"></div>
          <div class="choice-copy">
            <h2 id="localTitle"></h2>
            <p id="localDesc"></p>
          </div>
          <button id="openLocal" class="choice-button primary" type="button"></button>
        </section>

        <form class="choice" id="cloudForm" novalidate>
          <div class="hairline-mount choice-hairline" data-hairline-src="./assets/hairline/launcher-cloud.svg" aria-hidden="true"></div>
          <div class="choice-copy">
            <h2 id="cloudTitle"></h2>
            <p id="cloudDesc"></p>
            <label for="cloudUrl" id="cloudLabel"></label>
            <input id="cloudUrl" type="url" placeholder="https://your-life-ledger.example.com" autocomplete="off" spellcheck="false" />
            <p id="cloudError" role="alert" hidden></p>
          </div>
          <div class="choice-actions">
            <button id="openCloud" class="choice-button primary" type="submit"></button>
            <button id="forgetCloud" class="choice-button secondary" type="button"></button>
          </div>
        </form>
      </div>

      <p class="launcher-error" id="launcherError" role="alert" hidden></p>
      </section>
    </main>
    <script src="./interaction.js"></script>
    <script type="module" src="./launcher.js"></script>
  </body>
</html>
