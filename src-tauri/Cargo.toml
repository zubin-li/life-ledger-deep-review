[package]
name = "life-ledger-deep-review-desktop"
version = "4.0.0"
edition = "2021"

[lib]
name = "life_ledger_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
# Already present transitively via tauri itself; promoted to a direct dependency only to
# (de)serialize the widget bridge's JSON contract. Adds no new crate to the dependency tree.
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"
rfd = "0.15"
