[package]
name = "life-ledger-deep-review-desktop"
version = "3.0.0"
edition = "2021"

[lib]
name = "life_ledger_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
url = "2"
rfd = "0.15"

[features]
# QA probe for the real window (never in release builds): cargo build --features qa
qa = ["dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation"]

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSWindow", "NSView", "NSResponder", "NSButton", "NSControl"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSGeometry"] }
