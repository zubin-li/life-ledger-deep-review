name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run

  browser-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Browsers come preinstalled in the image; keep the tag equal to the playwright version in package-lock.json.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: apt-get update -qq && apt-get install -y -qq curl rsync >/dev/null
      - run: node --test --test-concurrency=1 --test-timeout=120000 --test-force-exit --test-shard=${{ matrix.shard }}/4 tests/*.browser.test.mjs

  # Branch protection requires a check named "browser": this gate passes only when every shard passed.
  browser:
    if: always()
    needs: browser-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.browser-shard.result }}" = success
