name: Publish stable release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release notes
        run: test -f ".github/releases/${GITHUB_REF_NAME}.md"

  macos-artifacts:
    runs-on: macos-15
    needs: verify
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
      - run: npm ci
      - run: npm run desktop:prepare
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build macOS desktop bundles (ad-hoc signed app, updater-signed archive)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "TAURI_SIGNING_PRIVATE_KEY secret is missing"; exit 1; }
          npm run desktop:build
      - name: Write the in-app update feed (latest.json)
        run: node scripts/updater-feed.mjs "src-tauri/target/release/bundle/macos" > src-tauri/target/release/bundle/macos/latest.json
      - name: Package app bundle zip
        env:
          TAURI_PRODUCT_NAME: Life Ledger
        run: |
          APP_NAME="${TAURI_PRODUCT_NAME}.app"
          cd "src-tauri/target/release/bundle/macos"
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}" "Life-Ledger.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: life-ledger-macos-release-bundles
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/Life-Ledger.app.zip
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/macos/latest.json
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [verify, macos-artifacts]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: life-ledger-macos-release-bundles
          path: release-assets
      - name: Create GitHub release with unsigned macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Life Ledger · Deep Review ${GITHUB_REF_NAME#v}" \
            --notes-file ".github/releases/${GITHUB_REF_NAME}.md" \
            release-assets/dmg/*.dmg \
            release-assets/macos/*.zip
      - name: Publish the in-app update (fixed mac-updates release read by installed apps)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release-assets/macos
          gh release view mac-updates >/dev/null 2>&1 || gh release create mac-updates --title "Mac app update feed" --notes "Read by the Life Ledger Mac app to offer in-app updates. Download the app from the latest version release instead." --latest=false
          gh release upload mac-updates *.app.tar.gz *.app.tar.gz.sig latest.json --clobber
